<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Rochade · Live</title>
    <script>
      // Before the first paint, so a dark page never flashes white. The same
      // key and rule as src/theme.ts.
      (function () {
        var choice = null;
        try { choice = localStorage.getItem("rochade.theme"); } catch (e) {}
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.style.colorScheme = dark ? "dark" : "light";
        if (dark) document.querySelector('meta[name="theme-color"]').content = "#0b0f17";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
