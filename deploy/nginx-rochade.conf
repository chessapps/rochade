# Rochade behind an existing nginx that owns the box's ports 80 and 443.
# Appended to that nginx's server list (on workbench: /home/bogner/app/nginx.conf,
# where the ACME challenge on :80 and the certbot renewal timer already exist).
# The certificate lineage covers both names:
#   certbot certonly --webroot -w /var/www/certbot --cert-name rochade.app \
#       -d rochade.app -d auth.rochade.app
# The rochade `web` container joins the proxy's network (PROXY_NETWORK in the
# env file) under the fixed name rochade-web.

# ---------------------------------------------------------------- Rochade app
server {
    listen 443 ssl;
    http2 on;
    server_name rochade.app;

    ssl_certificate     /etc/nginx/ssl/live/rochade.app/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/rochade.app/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    set $rochade http://rochade-web:8080;

    # Manager exports are small text files; generous anyway.
    client_max_body_size 20m;

    location / {
        proxy_pass $rochade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------- Rochade auth (Zitadel)
server {
    listen 443 ssl;
    http2 on;
    server_name auth.rochade.app;

    ssl_certificate     /etc/nginx/ssl/live/rochade.app/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/rochade.app/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    set $rochade_auth http://rochade-web:8081;

    # Zitadel's console answers with large headers, like Keycloak's.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass $rochade_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 120s;
    }
}
