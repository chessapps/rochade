services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seebach
      POSTGRES_PASSWORD: seebach
      POSTGRES_DB: seebach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seebach"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SEEBACH_DATABASE_URL: postgresql+psycopg://seebach:seebach@postgres:5432/seebach
      # Bootstrap auth: the bearer token is taken as the staff subject.
      # Replace with SEEBACH_OIDC_ISSUER once Zitadel is in front of this.
      SEEBACH_DEV_AUTH_ENABLED: "true"
      # Let a phone join by typing the tournament's code instead of scanning.
      # Also off by default; the QR needs a camera and a reachable URL, which
      # a laptop browser or a phone on another network does not always have.
      SEEBACH_DEVICE_JOIN_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      # Host port only; Caddy still listens on 8080 inside the container.
      - "${SEEBACH_WEB_PORT:-8092}:8080"

volumes:
  pgdata:
