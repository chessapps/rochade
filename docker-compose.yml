# Production-safe base. Local conveniences (the host port, dev auth, join by
# code) live in docker-compose.override.yml, which `docker compose up` picks
# up on its own; a deployment passes docker-compose.prod.yml instead and never
# sees them. See deploy/README.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seebach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seebach}
      POSTGRES_DB: seebach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seebach"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SEEBACH_DATABASE_URL: postgresql+psycopg://seebach:${POSTGRES_PASSWORD:-seebach}@postgres:5432/seebach
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # python-slim has no curl; the standard library does the same job.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # /health is proxied to the API, so this checks the whole path.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
