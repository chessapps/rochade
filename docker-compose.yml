services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seebach
      POSTGRES_PASSWORD: seebach
      POSTGRES_DB: seebach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seebach"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SEEBACH_DATABASE_URL: postgresql+psycopg://seebach:seebach@postgres:5432/seebach
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
